# Cấu hình Prometheus — Thu thập Metrics (Scraping)
#
# Prometheus hoạt động theo mô hình PULL: nó định kỳ gọi đến các endpoint /metrics
# của từng target để thu thập số liệu, thay vì các service tự đẩy dữ liệu vào.
#
# Luồng dữ liệu metrics trong dự án:
#   Services → OpenTelemetry Collector (:8889) → Prometheus → Grafana

global:
  scrape_interval: 10s      # Cứ 10 giây Prometheus gọi tất cả các target một lần
  evaluation_interval: 10s  # Cứ 10 giây đánh giá các alerting/recording rules một lần

scrape_configs:
  # OpenTelemetry Collector — nguồn metrics chính từ các microservice
  # Collector nhận metrics từ Order/Inventory service qua OTLP, rồi expose ra :8889 cho Prometheus pull
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Prometheus tự thu thập metrics của chính nó (self-monitoring)
  # Dùng để theo dõi hiệu suất và sức khoẻ của Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Thu thập metrics nội bộ của Loki (số log được xử lý, latency ghi...)
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Thu thập metrics nội bộ của Tempo (số trace được nhận, tốc độ ingest...)
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
