# File này dùng để override inventory_service sang bản tối ưu mà không làm hỏng file gốc
services:
  inventory_service:
    build:
      context: .
      dockerfile: docker_optimization/Dockerfile.optimized
    # Bỏ volumes để chứng minh code chạy từ bên trong Image đã build (đã được tối ưu)
    volumes: []
    # Bỏ --reload vì bản production/optimized không cần hot-reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 3002
