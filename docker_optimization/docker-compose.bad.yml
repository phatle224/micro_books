# File này dùng để override inventory_service sang bản CHƯA TỐI ƯU
services:
  inventory_service:
    build:
      context: .
      dockerfile: docker_optimization/Dockerfile.unoptimized
    volumes: []
    # Bản chưa tối ưu dùng cấu trúc thư mục khác nên command cũng khác một chút
    command: uvicorn inventory_service.app.main:app --host 0.0.0.0 --port 3002
