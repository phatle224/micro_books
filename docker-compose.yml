services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: microbooks-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: microbooks-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  order_service:
    build:
      context: ./order_service
      dockerfile: Dockerfile
    container_name: microbooks-order-service
    ports:
      - "${ORDER_SERVICE_PORT:-3001}:3001"
    environment:
      MONGO_URI: ${MONGO_URI}
      KAFKA_BROKER: kafka:9092
      SERVICE_PORT: 3001
      INVENTORY_SERVICE_URL: http://inventory_service:3002
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@microbooks.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-MicroBooks Admin}
      # Ép Uvicorn sử dụng cơ chế polling để nhận diện file thay đổi trên Windows
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./order_service:/app
    depends_on:
      kafka:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 3001 --reload
    restart: unless-stopped

  inventory_service:
    build:
      context: ./inventory_service
      dockerfile: Dockerfile
    container_name: microbooks-inventory-service
    ports:
      - "${INVENTORY_SERVICE_PORT:-3002}:3002"
    environment:
      MONGO_URI: ${MONGO_URI}
      KAFKA_BROKER: kafka:9092
      SERVICE_PORT: 3002
      # Ép Uvicorn sử dụng cơ chế polling để nhận diện file thay đổi trên Windows
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./inventory_service:/app
    depends_on:
      kafka:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 3002 --reload
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: microbooks-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: microbooks-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microbooks-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_ORDER_SERVICE_URL: http://order_service:3001
      NEXT_PUBLIC_INVENTORY_SERVICE_URL: http://inventory_service:3002
      # Kích hoạt Polling cho Next.js/Webpack
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - order_service
      - inventory_service
    command: npm run dev -- --hostname 0.0.0.0 --webpack
    restart: unless-stopped
