services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: microbooks-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: microbooks-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: microbooks-order-service
    ports:
      - "${ORDER_SERVICE_PORT:-3001}:3001"
    environment:
      MONGO_URI: ${MONGO_URI}
      KAFKA_BROKER: kafka:9092
      SERVICE_PORT: 3001
    volumes:
      - ./order-service/app:/app/app
    depends_on:
      - kafka
    command: uvicorn app.main:app --host 0.0.0.0 --port 3001 --reload
    restart: unless-stopped

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: microbooks-inventory-service
    ports:
      - "${INVENTORY_SERVICE_PORT:-3002}:3002"
    environment:
      MONGO_URI: ${MONGO_URI}
      KAFKA_BROKER: kafka:9092
      SERVICE_PORT: 3002
    volumes:
      - ./inventory-service/app:/app/app
    depends_on:
      - kafka
    command: uvicorn app.main:app --host 0.0.0.0 --port 3002 --reload
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microbooks-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_ORDER_SERVICE_URL: http://order-service:3001
      NEXT_PUBLIC_INVENTORY_SERVICE_URL: http://inventory-service:3002
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - order-service
      - inventory-service
    restart: unless-stopped
