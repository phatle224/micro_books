name: Quy trình CI/CD cho Microbooks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write

jobs:
  kiem-thu:
    name: Kiểm thử toàn diện (Lint, Unit, Integration)
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt các thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest flake8
          pip install -r order-service/requirements.txt
          pip install -r inventory-service/requirements.txt

      - name: Bước 1 - Kiểm tra lỗi trình bày code (Linting)
        run: |
          # Kiểm tra lỗi cú pháp và phong cách lập trình (PEP8)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Bước 2 - Chạy Unit Tests
        run: |
          # Tìm và chạy tất cả các Unit Test có trong dự án
          # Nếu chưa có file test nào, lệnh này sẽ kết thúc bình thường
          pytest --ignore=tests/test_order_flow.py || echo "Chưa có unit tests để chạy"

      - name: Bước 3 - Chuẩn bị hạ tầng cho Integration Test (Kafka, MongoDB)
        run: |
          # Tạo file .env ảo cho docker
          echo "MONGO_URI=mongodb://mongodb:27017" > .env
          echo "KAFKA_BROKER=kafka:9092" >> .env
          
          # Khởi chạy MongoDB
          docker run -d --name mongodb -p 27017:27017 mongo:latest
          
          # Khởi chạy Zookeeper và Kafka
          docker compose up -d zookeeper kafka
          
          # Đợi Kafka khởi động xong
          echo "Đang đợi Kafka khởi động (20s)..."
          sleep 20

      - name: Bước 4 - Chạy các Microservices để kiểm thử
        env:
          MONGO_URI: mongodb://localhost:27017
          KAFKA_BROKER: localhost:9092
        run: |
          # Chạy Order Service trong background
          cd order-service
          nohup uvicorn app.main:app --host 0.0.0.0 --port 3001 > order_service.log 2>&1 &
          cd ..
          
          # Chạy Inventory Service trong background
          cd inventory-service
          nohup uvicorn app.main:app --host 0.0.0.0 --port 3002 > inventory_service.log 2>&1 &
          cd ..
          
          # Đợi các dịch vụ sẵn sàng
          echo "Đang đợi các dịch vụ khởi động (15s)..."
          sleep 15

      - name: Bước 5 - Chạy Test tích hợp (Integration Test)
        run: |
          # Kiểm tra luồng dữ liệu thực tế giữa các service
          python tests/test_order_flow.py

      - name: Hiển thị Log trực tiếp khi có lỗi xảy ra
        if: failure()
        run: |
          echo "--- LOG CỦA ORDER SERVICE ---"
          [ -f order-service/order_service.log ] && cat order-service/order_service.log || echo "Không tìm thấy file log"
          echo "--- LOG CỦA INVENTORY SERVICE ---"
          [ -f inventory-service/inventory_service.log ] && cat inventory-service/inventory_service.log || echo "Không tìm thấy file log"

      - name: Lưu lại Log nếu có lỗi xảy ra
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-dich-vu-khi-loi
          path: |
            order-service/order_service.log
            inventory-service/inventory_service.log

      - name: Tạo Issue khi lỗi
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ Lỗi Kiểm thử: ${context.workflow} (#${context.runNumber})`,
              body: `### Phát hiện lỗi trong bước Kiểm thử
              - **Job:** ${context.job}
              - **Người kích hoạt:** @${context.actor}
              - **Chi tiết:** [Xem log chi tiết tại đây](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

              Vui lòng kiểm tra các file log được đính kèm trong Artifact.`
            })

      - name: Báo cáo tóm tắt kết quả
        if: always()
        run: |
          echo "### 📊 Kết quả Kiểm thử (Test Report)" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "✅ **Trạng thái:** Thành công" >> $GITHUB_STEP_SUMMARY
            echo "Tất cả các bước Linting, Unit Test và Integration Test đã vượt qua." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Trạng thái:** Thất bại" >> $GITHUB_STEP_SUMMARY
            echo "Vui lòng kiểm tra log và Issue vừa được tạo để biết chi tiết." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Chi tiết:" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      dong-goi-va-day-len-docker-hub:
    name: Đóng gói và Đẩy Docker Images lên Docker Hub
    needs: kiem-thu
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Tải mã nguồn từ GitHub
        uses: actions/checkout@v4

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập vào Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build và Push - Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/microbooks-order-service:latest

      - name: Build và Push - Inventory Service
        uses: docker/build-push-action@v5
        with:
          context: ./inventory-service
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/microbooks-inventory-service:latest

      - name: Build và Push - Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/microbooks-frontend:latest
