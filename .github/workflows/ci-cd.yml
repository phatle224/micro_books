name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -r order-service/requirements.txt
          pip install -r inventory-service/requirements.txt

      - name: Start Infrastructure (Kafka, Zookeeper, MongoDB)
        run: |
          # Create a dummy .env for docker-compose
          echo "MONGO_URI=mongodb://mongodb:27017" > .env
          echo "KAFKA_BROKER=kafka:9092" >> .env
          
          # Start MongoDB
          docker run -d --name mongodb -p 27017:27017 mongo:latest
          
          # Start Zookeeper and Kafka from docker compose
          docker compose up -d zookeeper kafka
          
          # Wait for Kafka to be ready
          echo "Waiting for Kafka to start..."
          sleep 20

      - name: Run Services
        env:
          MONGO_URI: mongodb://localhost:27017
          KAFKA_BROKER: localhost:9092
        run: |
          # Start Order Service
          cd order-service
          nohup uvicorn app.main:app --host 0.0.0.0 --port 3001 > order_service.log 2>&1 &
          cd ..
          
          # Start Inventory Service
          cd inventory-service
          nohup uvicorn app.main:app --host 0.0.0.0 --port 3002 > inventory_service.log 2>&1 &
          cd ..
          
          # Wait for services to be ready
          echo "Waiting for services to start..."
          sleep 15

      - name: Run Integration Test Script
        run: |
          python tests/test_order_flow.py

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            order-service/order_service.log
            inventory-service/inventory_service.log

  build-and-push:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/microbooks-order-service:latest

      - name: Build and push Inventory Service
        uses: docker/build-push-action@v5
        with:
          context: ./inventory-service
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/microbooks-inventory-service:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/microbooks-frontend:latest
