name: Local Deployment (CD)

on:
  workflow_run:
    workflows: ["Quy trình CI/CD cho Microbooks"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Triển khai trực tiếp trên máy local
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      - name: Tải mã nguồn mới nhất
        uses: actions/checkout@v4

      - name: Khôi phục file .env
        shell: powershell
        run: |
          $src = "C:\Users\ADMIN\Desktop\micro_books\.env"
          $dst = "${{ github.workspace }}\.env"
          if (Test-Path $src) {
            Copy-Item $src -Destination $dst -Force
            Write-Host ".env restored successfully."
          } else {
            Write-Error ".env not found at $src - deploy aborted."
            exit 1
          }

      - name: Đăng nhập vào Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Cập nhật và Khởi động lại các Service
        run: |
          docker-compose pull
          docker-compose up -d
        
      - name: Kiểm tra trạng thái các Container
        run: docker ps
