# Tên của quy trình: Triển khai ứng dụng tại môi trường local (CD)
name: Local Deployment (CD)

# Các điều kiện kích hoạt quy trình
on:
  # Tự động kích hoạt sau khi một quy trình khác hoàn thành
  workflow_run:
    # Tên quy trình cần theo dõi (phải khớp chính xác với tên trong file ci-cd.yml)
    workflows: ["Quy trình CI/CD cho Microbooks"]
    # Trạng thái quy trình trước đó: đã hoàn thành
    types:
      - completed
    # Chỉ chạy khi sự kiện xảy ra trên nhánh main
    branches: [main]
  # Cho phép kích hoạt thủ công từ giao diện GitHub
  workflow_dispatch: 

# Các biến môi trường dùng chung
env:
  # Lựa chọn mục tiêu triển khai: 'docker' (chạy bằng compose), 'k8s' (chạy trên kubernetes), hoặc 'both' (cả hai)
  DEPLOY_TARGET: 'k8s'

# Danh sách các công việc thực hiện
jobs:
  # Công việc chính: Triển khai
  deploy:
    # Tên hiển thị của công việc
    name: Triển khai trực tiếp trên máy local
    # Sử dụng Runner tự cấu hình (self-hosted) cài đặt trực tiếp trên máy của bạn
    runs-on: self-hosted 
    # Chỉ chạy nếu kích hoạt tay HOẶC quy trình CI/CD trước đó thành công
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
      # Bước 1: Tải mã nguồn mới nhất về máy local
      - name: Tải mã nguồn mới nhất
        uses: actions/checkout@v4

      # Bước 2: Khôi phục file cấu hình .env từ đường dẫn cố định trên máy local
      - name: Khôi phục file .env
        shell: powershell
        run: |
          # Đường dẫn lưu trữ file .env gốc trên máy local
          $src = "C:\Users\ADMIN\Desktop\micro_books\.env"
          # Đường dẫn đích trong thư mục làm việc của GitHub Runner
          $dst = "${{ github.workspace }}\.env"
          # Kiểm tra nếu file nguồn tồn tại thì thực hiện copy
          if (Test-Path $src) {
            Copy-Item $src -Destination $dst -Force
            Write-Host ".env restored successfully."
          } else {
            # Nếu không thấy file .env thì báo lỗi và dừng quy trình
            Write-Error ".env not found at $src - deploy aborted."
            exit 1
          }

      # Bước 3: Đăng nhập Docker Hub để có quyền tải (pull) các image private nếu có
      - name: Đăng nhập vào Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Bước 4: Triển khai bằng Docker Compose (nếu mục tiêu là 'docker' hoặc 'both')
      - name: Cập nhật và Khởi động lại các Service (Docker Compose)
        if: ${{ env.DEPLOY_TARGET == 'docker' || env.DEPLOY_TARGET == 'both' }}
        run: |
          # Tải các image mới nhất từ Docker Hub về
          docker-compose pull
          # Khởi động lại các container ở chế độ nền
          docker-compose up -d
        
      # Bước 5: Triển khai lên cụm Kubernetes local (nếu mục tiêu là 'k8s' hoặc 'both')
      - name: Triển khai lên Kubernetes (K8s)
        if: ${{ env.DEPLOY_TARGET == 'k8s' || env.DEPLOY_TARGET == 'both' }}
        shell: powershell
        run: |
          # Áp dụng các cấu hình Kubernetes bằng Kustomize
          kubectl apply -k k8s/base
          # Khởi động lại các deployment để nhận image mới nhất (nếu image tag là latest)
          kubectl rollout restart deployment frontend -n microbooks
          kubectl rollout restart deployment order-service -n microbooks
          kubectl rollout restart deployment inventory-service -n microbooks

      # Bước 6: Kiểm tra nhanh trạng thái sau khi triển khai
      - name: Kiểm tra trạng thái hệ thống
        run: |
          # Hiển thị các container đang chạy
          docker ps
          # Hiển thị trạng thái các Pod trong namespace microbooks
          kubectl get pods -n microbooks
