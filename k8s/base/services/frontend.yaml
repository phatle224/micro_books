apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: microbooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: kietne1211/microbooks-frontend:latest
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "200m"
            memory: "512Mi"
        env:
        - name: ORDER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: microbooks-config
              key: ORDER_SERVICE_URL
        - name: INVENTORY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: microbooks-config
              key: INVENTORY_SERVICE_URL
---
apiVersion: v1 # Phiên bản API cơ bản
kind: Service # Loại tài nguyên là Service (tạo điểm truy cập cố định cho các Pod)
metadata: # Thông tin mô tả
  name: frontend # Tên Service
  namespace: microbooks # Namespace của Service
spec: # Đặc tả của Service
  selector: # Cách Service tìm các Pod để chuyển tiếp traffic vào
    app: frontend # Tìm các Pod có nhãn app=frontend
  ports: # Cấu hình cổng cho Service
  - protocol: TCP # Giao thức TCP
    port: 3000 # Cổng mà Service lắng nghe
    targetPort: 3000 # Cổng trên Pod mà Service sẽ chuyển traffic tới
  type: LoadBalancer # Loại Service LoadBalancer (cấp IP public nếu chạy trên Cloud hoặc dùng Metallb)
