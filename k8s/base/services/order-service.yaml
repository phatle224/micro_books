apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microbooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: kietne1211/microbooks-order-service:latest
        ports:
        - containerPort: 3001
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: microbooks-secrets
              key: MONGO_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: microbooks-secrets
              key: JWT_SECRET
        - name: KAFKA_BROKER
          valueFrom:
            configMapKeyRef:
              name: microbooks-config
              key: KAFKA_BROKER
        - name: INVENTORY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: microbooks-config
              key: INVENTORY_SERVICE_URL
        - name: SERVICE_PORT
          value: "3001"
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_SERVICE_NAME
          value: "order-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: microbooks-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: microbooks
spec:
  selector:
    app: order-service
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001
  type: LoadBalancer
