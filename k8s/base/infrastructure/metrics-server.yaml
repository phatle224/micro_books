# ============================================================
# Metrics Server — CPU/RAM thực tế của Pod và Node
#
# Metrics Server thu thập số liệu tài nguyên thực tế từ kubelet
# trên mỗi node, cung cấp cho:
#   - HPA (Horizontal Pod Autoscaler): quyết định scale up/down
#   - kubectl top pods / kubectl top nodes: xem tài nguyên
#
# Khác biệt với kube-state-metrics:
#   Metrics Server     → CPU/RAM đang dùng THỰC TẾ (real-time, short-lived)
#   kube-state-metrics → Trạng thái K8s objects (persistent, cho monitoring)
#
# Lưu ý: Metrics Server KHÔNG lưu lịch sử — chỉ giữ giá trị hiện tại.
# Để xem lịch sử dài hạn, dùng Prometheus.
# ============================================================

# ServiceAccount trong namespace kube-system — Metrics Server là thành phần hệ thống
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-server
  namespace: kube-system
---
# ClusterRole cho phép các admin/editor/viewer đọc metrics qua API metrics.k8s.io
# Label aggregate-to-* tự động gộp quyền này vào các ClusterRole có sẵn của K8s
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:aggregated-metrics-reader
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list", "watch"]
---
# ClusterRole chính cho Metrics Server — quyền đọc metrics từ kubelet
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system:metrics-server
rules:
  - apiGroups: [""]
    resources:
      - nodes/metrics  # Endpoint kubelet cung cấp CPU/RAM của từng container
    verbs: ["get"]
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - namespaces
      - configmaps
    verbs: ["get", "list", "watch"]
---
# RoleBinding cho phép Metrics Server đọc extension-apiserver-authentication
# ConfigMap trong kube-system — cần để xác thực API calls
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-server-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system
---
# Cho phép Metrics Server uỷ quyền xác thực sang API server chính
# Cần thiết vì Metrics Server đăng ký như một extension API server
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-server:system:auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system
---
# Gắn ClusterRole system:metrics-server vào ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system:metrics-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:metrics-server
subjects:
  - kind: ServiceAccount
    name: metrics-server
    namespace: kube-system
---
# Service nội bộ — API server K8s gọi đến đây để lấy metrics
apiVersion: v1
kind: Service
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  selector:
    app: metrics-server
  ports:
    - name: https
      port: 443         # HTTPS vì Metrics Server yêu cầu TLS với API server
      targetPort: https
---
# ============================================================
# Deployment — chạy Metrics Server pod
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
  labels:
    app: metrics-server
spec:
  selector:
    matchLabels:
      app: metrics-server
  template:
    metadata:
      labels:
        app: metrics-server
    spec:
      serviceAccountName: metrics-server
      # system-cluster-critical: K8s ưu tiên giữ pod này alive ngay cả khi node đang bị áp lực tài nguyên
      priorityClassName: system-cluster-critical
      containers:
        - name: metrics-server
          image: registry.k8s.io/metrics-server/metrics-server:v0.7.2
          args:
            - --cert-dir=/tmp                                          # Lưu TLS cert tạm thời vào /tmp
            - --secure-port=10250                                      # Cổng HTTPS lắng nghe
            - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname  # Thứ tự ưu tiên kết nối kubelet
            - --kubelet-use-node-status-port                           # Dùng port từ Node status thay vì hardcode
            - --metric-resolution=15s                                  # Thu thập metrics mỗi 15 giây
            - --kubelet-insecure-tls                                   # Bỏ qua verify TLS cert của kubelet — cần thiết cho môi trường local/dev
          ports:
            - containerPort: 10250
              name: https
          livenessProbe:
            httpGet:
              path: /livez   # Endpoint kiểm tra Metrics Server còn sống không
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz  # Endpoint kiểm tra Metrics Server đã sẵn sàng phục vụ chưa
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
            limits:
              cpu: "250m"
              memory: "300Mi"
---
# APIService đăng ký Metrics Server như một extension API server.
# Sau khi apply, lệnh "kubectl top" và HPA có thể gọi API metrics.k8s.io/v1beta1.
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
spec:
  service:
    name: metrics-server
    namespace: kube-system
  group: metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true  # Bỏ qua TLS verify — chấp nhận được cho môi trường local
  groupPriorityMinimum: 100
  versionPriority: 100
