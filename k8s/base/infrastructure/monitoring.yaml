apiVersion: apps/v1
kind: Deployment
metadata:
  name: promtail
  namespace: microbooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail # Cần quyền để đọc Pod log
      containers:
      - name: promtail
        image: grafana/promtail:3.1.0
        args: ["-config.file=/etc/promtail/promtail-config.yml"]
        volumeMounts:
        - name: promtail-config
          mountPath: /etc/promtail/promtail-config.yml
          subPath: promtail-config.yaml
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
      volumes:
      - name: promtail-config
        configMap:
          name: monitoring-configs
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
---
