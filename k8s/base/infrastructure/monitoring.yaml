apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: microbooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.100.0
        args: ["--config=/etc/otelcol-contrib/config.yml"]
        ports:
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 8889
        volumeMounts:
        - name: otel-config
          mountPath: /etc/otelcol-contrib/config.yml
          subPath: otel-collector-config.yaml
      volumes:
      - name: otel-config
        configMap:
          name: monitoring-configs
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: microbooks
spec:
  selector:
    app: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: metrics
    port: 8889
    targetPort: 8889
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: microbooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.53.0
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--web.enable-remote-write-receiver"
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
      volumes:
      - name: prometheus-config
        configMap:
          name: monitoring-configs
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: microbooks
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: microbooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.1.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        volumeMounts:
        - name: grafana-provisioning-datasources
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
        - name: grafana-provisioning-dashboards
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards/microservices-dashboard.json
          subPath: microservices-dashboard.json
      volumes:
      - name: grafana-provisioning-datasources
        configMap:
          name: monitoring-configs
      - name: grafana-provisioning-dashboards
        configMap:
          name: monitoring-configs
      - name: grafana-dashboards
        configMap:
          name: monitoring-configs
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: microbooks
spec:
  selector:
    app: grafana
  ports:
  - port: 3005
    targetPort: 3000
  type: LoadBalancer
---
