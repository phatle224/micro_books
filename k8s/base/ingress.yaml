apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microbooks-ingress
  namespace: microbooks
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: microbooks.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
