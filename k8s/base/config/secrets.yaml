apiVersion: v1
kind: Secret
metadata:
  # Secret chứa dữ liệu nhạy cảm; ứng dụng thường mount hoặc inject qua env vars.
  name: microbooks-secrets
  namespace: microbooks
type: Opaque
stringData:
  # Chuỗi kết nối MongoDB. stringData cho phép ghi plain text và sẽ được API server mã hóa sang data.
  MONGO_URI: "mongodb+srv://truongquockiet1211_db_user:1234567890@cnlthd.ijxnmqz.mongodb.net/?appName=CNLTHD"
  # Khóa ký JWT cho môi trường dev; cần thay bằng giá trị mạnh hơn ở production.
  JWT_SECRET: "dev-secret-change"
  # Tài khoản admin khởi tạo sẵn cho hệ thống.
  ADMIN_EMAIL: "admin@microbooks.com"
  # Mật khẩu admin mặc định; không nên giữ nguyên khi triển khai thật.
  ADMIN_PASSWORD: "admin123"
