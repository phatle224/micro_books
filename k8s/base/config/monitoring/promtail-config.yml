server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: kubernetes-pods
    static_configs:
      - targets: [localhost]
        labels:
          job: kubernetes
          __path__: /var/log/pods/microbooks_*/*/*.log
    pipeline_stages:
      - docker: {}
      - regex:
          source: filename
          expression: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>.+)_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/(?P<container>[^/]+)/'
      - labels:
          namespace:
          pod:
          container:
      - regex:
          expression: '(?i)^(?P<level>ERROR|WARN|WARNING|INFO|DEBUG|CRITICAL)[:\s]'
      - labels:
          level:
