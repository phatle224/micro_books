global:
  # Chu kỳ scrape và đánh giá rule mặc định cho toàn bộ jobs.
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Kéo metric do OTEL Collector expose dưới dạng Prometheus endpoint.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Tự giám sát chính Prometheus.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Kéo metric nội bộ của Loki.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # Kéo metric nội bộ của Tempo.
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  # Thu thập cluster state metrics: deployment, pod status, node state, ...
  - job_name: kube-state-metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["kube-state-metrics.microbooks.svc.cluster.local:8080"]

  # cAdvisor: scrape container CPU/Memory metrics from each node via k8s API proxy
  - job_name: kubernetes-cadvisor
    scheme: https
    tls_config:
      # Dùng CA/tokens gắn sẵn trong service account để truy cập kube-apiserver.
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      # Discover tất cả node rồi đổi target sang API proxy của từng node.
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

  # Scrape pod metrics annotations in microbooks namespace
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          # Chỉ theo dõi Pod trong namespace microbooks để giảm nhiễu.
          names: [microbooks]
    relabel_configs:
      # Chỉ scrape Pod có annotation prometheus.io/scrape="true".
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      # Nếu Pod khai báo metrics path riêng thì thay path mặc định.
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      # Gộp host hiện tại với port được annotate để tạo target scrape cuối cùng.
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # Copy Kubernetes pod labels thành Prometheus labels.
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
