apiVersion: v1
kind: ResourceQuota
metadata:
  # ResourceQuota giới hạn tổng tài nguyên mà namespace microbooks được phép dùng.
  name: microbooks-quota
  namespace: microbooks
spec:
  hard:
    # Tổng CPU request tối đa của tất cả Pod trong namespace.
    requests.cpu: "4"
    # Tổng memory request tối đa.
    requests.memory: "4Gi"
    # Tổng CPU limit tối đa.
    limits.cpu: "8"
    # Tổng memory limit tối đa.
    limits.memory: "8Gi"
    # Số Pod tối đa được tạo trong namespace.
    pods: "50"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  # PDB đảm bảo frontend luôn còn ít nhất 1 Pod khi có voluntary disruption.
  name: frontend-pdb
  namespace: microbooks
spec:
  minAvailable: 1
  selector:
    matchLabels:
      # Áp dụng cho các Pod có label app=frontend.
      app: frontend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  # PDB cho order-service để giảm rủi ro downtime trong lúc drain node/rolling update.
  name: order-service-pdb
  namespace: microbooks
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: order-service
